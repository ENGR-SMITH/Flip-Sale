openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Distress Intelligence operations API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operational overview and activity
  - name: leads
    description: Evidence-backed opportunity records
  - name: workers
    description: Available field workers and crews
  - name: jobs
    description: Physical operations jobs
  - name: intake
    description: Public client service requests and operator review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get current operational totals
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent lead and job activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: Search and filter leads
      parameters:
        - name: assetClass
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssetClass"
        - name: stage
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/LeadStage"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Matching leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a lead and calculate its current score and route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update a lead and recalculate its current score and route
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadUpdate"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "400":
          description: Invalid lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete a lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Lead deleted
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leads/{id}/evidence:
    get:
      operationId: listLeadEvidence
      tags: [leads]
      summary: List the provenance records attached to a lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Lead evidence, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadEvidence"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addLeadEvidence
      tags: [leads]
      summary: Add an append-only provenance record to a lead
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadEvidenceInput"
      responses:
        "201":
          description: Evidence record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadEvidence"
        "400":
          description: Invalid evidence record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /leads/{id}/authority-reviews:
    get:
      operationId: listEstateAuthorityReviews
      tags: [leads]
      summary: List the immutable authority review history for a lead
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Authority review history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EstateAuthorityReview"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addEstateAuthorityReview
      tags: [leads]
      summary: Record an append-only estate authority decision
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstateAuthorityReviewInput"
      responses:
        "201":
          description: Authority review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstateAuthorityReview"
        "400":
          description: Invalid authority review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lead not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List registered sources and their current permission review state
      responses:
        "200":
          description: Sources owned by the signed-in operator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
    post:
      operationId: createSource
      tags: [sources]
      summary: Register a source without approving it for use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceInput"
      responses:
        "201":
          description: Source registered in pending review state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: Invalid source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/{id}:
    patch:
      operationId: updateSource
      tags: [sources]
      summary: Update source details; changes to approved details return the source to pending review
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceUpdate"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: Invalid source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/{id}/reviews:
    get:
      operationId: listSourceReviews
      tags: [sources]
      summary: List the immutable permission review history for a source
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Source review history, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceReview"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: addSourceReview
      tags: [sources]
      summary: Record an explicit source permission and terms review
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceReviewInput"
      responses:
        "201":
          description: Source review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceReview"
        "400":
          description: Source review cannot be recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/{id}/collection:
    post:
      operationId: updateSourceCollection
      tags: [sources]
      summary: Enable or pause scheduled collection for an approved source
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceCollectionUpdate"
      responses:
        "200":
          description: Updated collection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"
        "400":
          description: Source cannot be collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/{id}/runs:
    post:
      operationId: runSourceCollection
      tags: [sources]
      summary: Start an immediate collection run for an approved source
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Collection run accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRun"
        "400":
          description: Source cannot be collected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Apify is not configured for scraping-provider sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/runs:
    get:
      operationId: listSourceRuns
      tags: [sources]
      summary: List collection runs
      parameters:
        - name: sourceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Collection runs for the signed-in operator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceRun"
  /sources/runs/{id}/refresh:
    post:
      operationId: refreshSourceRun
      tags: [sources]
      summary: Refresh a collection run and import provider data when available
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Refreshed collection run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceRun"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/observations:
    get:
      operationId: listSourceObservations
      tags: [sources]
      summary: List updates collected from approved sources for human review
      parameters:
        - name: assetClass
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssetClass"
        - name: reviewStatus
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SourceObservationStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Source observations for the signed-in operator
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceObservation"
  /sources/observations/{id}:
    patch:
      operationId: updateSourceObservation
      tags: [sources]
      summary: Dismiss or return a collected update to the review queue
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceObservationUpdate"
      responses:
        "200":
          description: Updated source observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceObservation"
        "404":
          description: Observation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/observations/{id}/lead:
    post:
      operationId: convertSourceObservationToLead
      tags: [sources, leads]
      summary: Create a reviewed lead and attach the collected observation as evidence
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Created lead and marked the observation as converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceObservationLeadResult"
        "400":
          description: Lead details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Observation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sources/observations/{id}/auto-fill:
    get:
      operationId: autoFillSourceObservation
      tags: [sources]
      summary: Suggest a jurisdiction and a next operator action for a collected update
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Suggestion built from the US Census Geocoder plus Gemini when an API key is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceObservationAutoFill"
        "404":
          description: Observation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /client/requests:
    post:
      operationId: createClientServiceRequest
      tags: [intake]
      summary: Submit a service inquiry from the public client portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientServiceRequestInput"
      responses:
        "201":
          description: Service request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientServiceRequestSubmitted"
        "400":
          description: Request details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests from this connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listClientServiceRequests
      tags: [intake]
      summary: List client service requests for operator review
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ClientServiceRequestStatus"
      responses:
        "200":
          description: Client requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientServiceRequest"
  /client/requests/{id}:
    patch:
      operationId: updateClientServiceRequest
      tags: [intake]
      summary: Update a client request's review status or internal note
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientServiceRequestUpdate"
      responses:
        "200":
          description: Updated client request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientServiceRequest"
        "404":
          description: Request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /launch/sources:
    get:
      operationId: listLaunchSources
      tags: [sources]
      summary: List only approved sources available for manual lead attribution
      responses:
        "200":
          description: Sources approved for the launch workspace
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Source"
  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List field workers and optional proximity to a job
      parameters:
        - name: available
          in: query
          required: false
          schema:
            type: boolean
        - name: jobId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matching workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [workers]
      summary: Add a worker or crew profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerInput"
      responses:
        "201":
          description: Created worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          description: Invalid worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /workers/{id}:
    patch:
      operationId: updateWorker
      tags: [workers]
      summary: Update a worker or crew profile
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerUpdate"
      responses:
        "200":
          description: Updated worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          description: Invalid worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWorker
      tags: [workers]
      summary: Remove a worker profile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Worker deleted
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List physical operations jobs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: leadId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Matching jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Schedule a physical operations job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}:
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job, its status, or its worker assignment
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          description: Invalid job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Job deleted
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]
    AssetClass:
      type: string
      enum: [storage, real_estate, estate, commercial, junk, package]
    CountyCoverageEntry:
      type: string
      minLength: 2
      maxLength: 80
    LaunchCounty:
      type: string
      enum: [harris, fort_bend, dallas, tarrant]
    EstateAuthorityStatus:
      type: string
      enum: [unknown, verified, rejected]
    SourceAccessMethod:
      type: string
      enum: [manual_entry, public_download, authorized_feed, api, approved_scraping_provider, partner_submission, other]
    SourcePermissionStatus:
      type: string
      enum: [pending, approved, rejected]
    LeadStage:
      type: string
      enum: [detected, researched, contacted, negotiating, under_contract, monetizing, settled, dead]
    LeadDecision:
      type: string
      enum: [bid, conditional_bid, watch, pass, contract, option_refer, cleanout_consign, hybrid, refer, run, review]
    JobStatus:
      type: string
      enum: [open, invited, assigned, in_progress, completed, cancelled]
    RiskFlag:
      type: string
      enum:
        - biohazard
        - drug_paraphernalia
        - water_damage
        - paperwork_only
        - firearm_without_ffl
        - unclear_vehicle_title
        - unresolvable_title
        - owner_refuses
        - occupancy_outside_scope
        - unlicensed_jurisdiction
        - heir_dispute
        - no_signed_authorization
        - hoarding_remediation_required
    ScoreContribution:
      type: object
      additionalProperties: false
      properties:
        input: { type: string }
        weight: { type: number }
        score: { type: ["number", "null"] }
        contribution: { type: number }
      required: [input, weight, score, contribution]
    CurrencyTotal:
      type: object
      additionalProperties: false
      properties:
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        amount: { type: number }
      required: [currencyCode, amount]
    Lead:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        assetClass: { $ref: "#/components/schemas/AssetClass" }
        stage: { $ref: "#/components/schemas/LeadStage" }
        location: { type: string }
        source: { type: string }
        sourceId: { type: ["string", "null"], format: uuid }
        distressSignal: { type: string }
        estateAuthorityStatus: { $ref: "#/components/schemas/EstateAuthorityStatus" }
        estateAuthorityEvidenceRef: { type: ["string", "null"] }
        estateAuthorityReviewerId: { type: ["string", "null"] }
        estateAuthorityReviewedAt: { type: ["string", "null"], format: date-time }
