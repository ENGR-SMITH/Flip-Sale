      additionalProperties: false
      properties:
        totalLeads: { type: integer }
        needsResearch: { type: integer }
        awaitingReview: { type: integer }
        activeDeals: { type: integer }
        openJobs: { type: integer }
        availableWorkers: { type: integer }
        expectedPipelineValueByCurrency:
          type: array
          items: { $ref: "#/components/schemas/CurrencyTotal" }
        byAssetClass:
          type: array
          items:
            $ref: "#/components/schemas/AssetClassCount"
        byStage:
          type: array
          items:
            $ref: "#/components/schemas/StageCount"
      required: [totalLeads, needsResearch, awaitingReview, activeDeals, openJobs, availableWorkers, expectedPipelineValueByCurrency, byAssetClass, byStage]
    AssetClassCount:
      type: object
      additionalProperties: false
      properties:
        assetClass: { $ref: "#/components/schemas/AssetClass" }
        count: { type: integer }
      required: [assetClass, count]
    StageCount:
      type: object
      additionalProperties: false
      properties:
        stage: { $ref: "#/components/schemas/LeadStage" }
        count: { type: integer }
      required: [stage, count]
    ActivityItem:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [lead_created, lead_updated, evidence_added, job_created, job_updated] }
        title: { type: string }
        detail: { type: string }
        occurredAt: { type: string, format: date-time }
      required: [id, kind, title, detail, occurredAt]
    Worker:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        homeArea: { type: string }
