        estimatedHours: { type: ["number", "null"] }
        payoutAmount: { type: ["number", "null"] }
        currencyCode: { type: ["string", "null"], pattern: "^[A-Z]{3}$" }
        payoutStructure: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        workerId: { type: ["string", "null"], format: uuid }
        workerName: { type: ["string", "null"] }
        latitude: { type: ["number", "null"] }
        longitude: { type: ["number", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, leadId, title, jobType, location, scheduledAt, requiredSkills, estimatedHours, payoutAmount, currencyCode, payoutStructure, status, workerId, workerName, latitude, longitude, createdAt, updatedAt]
    JobInput:
