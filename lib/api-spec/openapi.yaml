          type: array
          items: { type: string }
        isAvailable: { type: boolean }
        serviceRadiusKm: { type: number }
        locationConfigured: { type: boolean }
        distanceKm: { type: ["number", "null"] }
        eligibleForJob: { type: ["boolean", "null"] }
        withinServiceRadius: { type: ["boolean", "null"] }
        matchReasons:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, displayName, homeArea, skills, isAvailable, serviceRadiusKm, locationConfigured, distanceKm, eligibleForJob, withinServiceRadius, matchReasons, createdAt, updatedAt]
    WorkerInput:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 160 }
        homeArea: { type: string, minLength: 1, maxLength: 240 }
        skills:
          type: array
          items: { type: string, maxLength: 80 }
          maxItems: 20
        isAvailable: { type: boolean }
        serviceRadiusKm: { type: number, minimum: 0 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
      required: [displayName, homeArea, skills, isAvailable, serviceRadiusKm]
    WorkerUpdate:
